
name: Cookiecutter Template CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Cookiecutter
        run: python -m pip install cookiecutter

      - name: Generate sample project
        run: |
          cookiecutter . --no-input \
            project_name="Iris ML Demo" \
            project_slug="iris-ml-demo"

      - name: Install project dependencies
        working-directory: iris-ml-demo
        run: python -m pip install -r requirements.txt

      - name: Train ML model
        working-directory: iris-ml-demo
        run: python -m src.train

      - name: Run automated tests
        working-directory: iris-ml-demo
        run: python -m pytest tests/ -v

      - name: Verify Docker build
        run: docker build -t mlops-template-test:v1 ./iris-ml-demo
